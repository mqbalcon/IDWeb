<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas Universitarias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .completada { text-decoration: line-through; color: gray; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h1 class="h3 mb-0">Gestor de Tareas Universitarias</h1>
                </div>

                <div class="card-body">

                    <div id="alertas"></div>

                    <form id="todo-form" class="mb-4">
                        <input type="text" id="titulo" class="form-control mb-2" placeholder="Título">
                        <input type="text" id="curso" class="form-control mb-2" placeholder="Curso">
                        <input type="date" id="fechaEntrega" class="form-control mb-2">
                        <button type="submit" class="btn btn-primary w-100">Agregar tarea</button>
                    </form>

                    <div class="mb-3">
                        <button class="btn btn-outline-primary btn-sm" data-filtro="todas">Todas</button>
                        <button class="btn btn-outline-primary btn-sm" data-filtro="pendientes">Pendientes</button>
                        <button class="btn btn-outline-primary btn-sm" data-filtro="completadas">Completadas</button>
                    </div>

                    <p id="contador" class="text-muted"></p>


                    <ul id="todo-list" class="list-group"></ul>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
